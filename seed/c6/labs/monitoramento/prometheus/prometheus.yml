global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - regras.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['lab-mon-am:9093']
scrape_configs:
  - job_name: app
    static_configs:
      - targets: ['lab-mon-app:3000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
