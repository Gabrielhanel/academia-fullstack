upstream app_rr { server lab-ngx-app1:3000; server lab-ngx-app2:3000; server lab-ngx-app3:3000; }
upstream app_lc { least_conn; server lab-ngx-app1:3000; server lab-ngx-app2:3000; server lab-ngx-app3:3000; }
upstream app_fo { server lab-ngx-app1:3000 max_fails=1 fail_timeout=5s; server lab-ngx-app2:3000 max_fails=1 fail_timeout=5s; server lab-ngx-app3:3000 max_fails=1 fail_timeout=5s; }
limit_req_zone $binary_remote_addr zone=lim:1m rate=5r/s;
gzip on; gzip_min_length 1024; gzip_types application/json;

server {
  listen 80;
  return 301 https://localhost:38443$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name localhost;
  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  proxy_connect_timeout 1s;

  location / {
    proxy_pass http://app_rr;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /sem-cabecalhos/ { proxy_pass http://app_rr/; }
  location /lc/ { proxy_pass http://app_lc/; }
  location /fo/ {
    proxy_pass http://app_fo/;
    proxy_next_upstream error timeout http_502 http_503;
  }
  location /fo-sem/ {
    proxy_pass http://app_fo/;
    proxy_next_upstream off;
  }
  location /limitado/ {
    limit_req zone=lim burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://app_rr/;
  }
}
