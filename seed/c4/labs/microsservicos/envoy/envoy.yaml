admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 59901 } }
static_resources:
  listeners:
    - name: entrada
      address: { socket_address: { address: 127.0.0.1, port_value: 59200 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: entrada
                route_config:
                  name: rotas
                  virtual_hosts:
                    - name: servicos
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/instavel" }
                          route:
                            cluster: instavel
                            timeout: 2s
                            retry_policy: { retry_on: "5xx,connect-failure", num_retries: 3, per_try_timeout: 0.3s }
                        - match: { prefix: "/lento" }
                          route:
                            cluster: lento
                            timeout: 2s
                            retry_policy: { retry_on: "5xx", num_retries: 2, per_try_timeout: 0.2s }
                        - match: { prefix: "/par" }
                          route: { cluster: par, timeout: 2s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: instavel
      type: STATIC
      connect_timeout: 1s
      load_assignment: { cluster_name: instavel, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 59201 } } } }] }] }
    - name: lento
      type: STATIC
      connect_timeout: 1s
      load_assignment: { cluster_name: lento, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 59202 } } } }] }] }
    - name: par
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      outlier_detection: { consecutive_5xx: 3, interval: 0.5s, base_ejection_time: 30s, max_ejection_percent: 50 }
      load_assignment:
        cluster_name: par
        endpoints:
          - lb_endpoints:
              - { endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 59203 } } } }
              - { endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 59204 } } } }
