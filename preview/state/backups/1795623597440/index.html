<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academia Full Stack v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: escola de engenharia séria e direta; o conhecimento pertence à plataforma.
   IDEA: caderno de laboratório + grade curricular de universidade técnica (mesma identidade da v1).
   PICTURE: painel menta com o progresso real e a lista de próximos conteúdos; aulas como apostilas.
   COLOUR and TYPE: preto e branco + campo menta #b8f5d0; Space Grotesk 700, Inter, JetBrains Mono.
   LAYOUT: barra lateral no desktop, navegação rolável no topo do celular; conteúdo até 1240px. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0e0e);--ink:light-dark(#0b0b0b,#f1f2f0);--mut:light-dark(#5a5f5d,#a2a8a5);--line:light-dark(#e3e6e4,#272a2a);--soft:light-dark(#f5f6f5,#151717);--field:light-dark(#b8f5d0,#11231a);--fink:light-dark(#0b0b0b,#b8f5d0);--ok:light-dark(#0d7a42,#7fe3a9);--warn:light-dark(#9a4508,#f4b27c);--bad:light-dark(#b42318,#ff9087);--btn:light-dark(#0b0b0b,#b8f5d0);--btnink:light-dark(#ffffff,#0b0b0b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.1;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(28px,4vw,44px)}h2{font-size:24px;margin-top:1.3em}h3{font-size:18px}
a{color:inherit}p{margin:.5em 0}
code,pre,textarea.code{font-family:"JetBrains Mono",ui-monospace,monospace}
code{overflow-wrap:anywhere;background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.9em}
pre,.scroll{overflow-x:auto}.scroll a{flex:none}
html{scroll-padding-top:72px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font:700 20px/1.1 "Space Grotesk",sans-serif;padding:0 10px 14px;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--field);border:2px solid var(--ink);display:inline-block;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-weight:500;color:var(--mut)}
.nav a:hover{background:var(--soft);color:var(--ink)}.nav a.on{background:var(--ink);color:var(--bg)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--warn);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.stat{margin-top:auto;font-size:13px;color:var(--mut);padding:10px;border-top:1px solid var(--line)}.stat b{color:var(--ink);font-weight:600}
main{padding:clamp(20px,3.4vw,44px) max(4vw,16px) 80px;max-width:1240px;width:100%}
.crumb{font-size:14px;color:var(--mut);margin-bottom:8px}.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.lead{color:var(--mut);max-width:72ch;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btnink);font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}.btn.g:hover{border-color:var(--ink)}
.btn.s{min-height:36px;padding:0 12px;font-size:14px}.btn.d{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #34c77b;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}

.card.link{text-decoration:none;display:block}.card.link:hover{border-color:var(--ink)}

.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}

.rec .dot.w{background:var(--warn)}.rec .dot.m{background:#34c77b}.rec .dot.r{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}input[type=checkbox],input[type=radio]{width:20px;height:20px;flex:none;margin:2px 0 0}
label{font-size:14px;font-weight:600;display:block;margin:12px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;flex-wrap:wrap}
.item:last-child{border:0}a.item:hover{background:var(--soft)}.item .t{flex:1;min-width:180px}
.item .num{font:700 14px "Space Grotesk",sans-serif;width:28px;color:var(--mut);flex:none}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:18px 0;overflow-x:auto}
.tabs button{min-height:44px;padding:0 16px;border:0;background:none;color:var(--mut);font:600 15px Inter,sans-serif;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;flex:none}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.md{max-width:78ch}.md h2{font-size:22px}.md h3{font-size:18px;margin-top:1.1em}.md li{margin:4px 0}
.md blockquote{margin:12px 0;padding:8px 16px;border-left:4px solid var(--field);background:var(--soft);border-radius:0 8px 8px 0}
.md .tw{overflow-x:auto;margin:12px 0}
.lesson section{margin:26px 0}.lesson section>h2{border-top:1px solid var(--line);padding-top:18px}
.code{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden;max-width:100%}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;background:var(--soft);font-size:13px;color:var(--mut);gap:8px}
.code pre{margin:0;padding:14px;font-size:14px;line-height:1.55}.code pre code{background:none;padding:0}
.cp{min-height:30px;border:0;background:none;color:var(--ink);font:600 13px Inter,sans-serif;cursor:pointer;padding:0 8px}
.ln{display:grid;grid-template-columns:3em minmax(0,1fr);margin:0;padding:10px 0;font:14px/1.55 "JetBrains Mono",monospace;overflow-x:auto}
.ln span{color:var(--mut);text-align:right;padding-right:12px;user-select:none}.ln code{background:none;padding:0;white-space:pre}
.tok-k{color:light-dark(#7c3aed,#c4a7ff)}.tok-s{color:light-dark(#0d7a42,#7fe3a9)}.tok-c{color:var(--mut);font-style:italic}.tok-n{color:light-dark(#b45309,#f4b27c)}
.notes{font-size:14px;margin:8px 0 0;padding:10px 14px;background:var(--soft);border-radius:10px}
.notes div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;padding:3px 0}.notes b{font-family:"JetBrains Mono",monospace;font-size:13px}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.concepts div{border:1px solid var(--line);border-radius:10px;padding:12px}.concepts b{display:block;margin-bottom:4px}
.ex{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.ex.good{border-color:var(--ok)}.ex.badx{border-color:var(--warn)}
.ex .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;font-weight:400}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.bugline{display:grid;grid-template-columns:3em minmax(0,1fr);width:100%;text-align:left;border:0;background:none;color:var(--ink);font:14px/1.6 "JetBrains Mono",monospace;padding:2px 0;cursor:pointer;border-radius:4px}
.bugline:hover{background:var(--soft)}.bugline.sel{background:color-mix(in srgb,var(--warn) 18%,transparent)}.bugline.right{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.bugline span{color:var(--mut);text-align:right;padding-right:12px}.bugline code{background:none;white-space:pre;padding:0}
.fillcode{font:14px/2.1 "JetBrains Mono",monospace;white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:10px;overflow-x:auto}
.fillcode input{width:auto;min-width:9ch;display:inline-block;padding:2px 8px;font:14px "JetBrains Mono",monospace;border-radius:6px}
.fillcode input.right{border-color:var(--ok)}.fillcode input.wrong{border-color:var(--bad)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 12px;align-items:center}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:15px}
.ed{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;min-height:220px;background:var(--soft)}
.ed .cm-editor{min-height:220px;max-height:560px;font-size:14px}.ed .cm-scroller{font-family:"JetBrains Mono",monospace}
textarea.code{min-height:240px;font-size:14px;line-height:1.5;tab-size:2;background:var(--soft);border:0;border-radius:0}
.out{background:#0b0b0b;color:#d9f7e6;border-radius:10px;padding:12px 14px;font:13px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;min-height:48px;margin:10px 0;overflow-x:auto}
.tres{list-style:none;padding:0;margin:10px 0}.tres li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.msg{padding:14px 16px;border-radius:14px;margin:10px 0}.msg.u{background:var(--soft);margin-left:min(12%,80px)}.msg.a{border:1px solid var(--line)}
.msg .who{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.empty{padding:28px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--mut)}
.load{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.load{animation:none}}
.flash{border:1.5px solid var(--ink);border-radius:18px;padding:28px;min-height:220px;display:flex;flex-direction:column;gap:14px}
.flash .a{border-top:1px dashed var(--line);padding-top:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;border-bottom:1px solid var(--line);padding-top:10px}
.bars div{flex:1;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}.bars div.z{background:var(--line)}
.barsx{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 30px #0003}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:40;padding:16px}
.ov .card{max-width:560px;width:100%;max-height:86vh;overflow:auto}
.rel-critica{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.rel-alta{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.rel-media{background:var(--field);color:var(--fink)}.rel-informativa{background:var(--soft);color:var(--mut)}
.tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1.5px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--soft)}
.tb button{min-height:32px;min-width:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:600 13px Inter,sans-serif;cursor:pointer}
.tb+textarea{border-radius:0 0 10px 10px}
.aibox{border:1.5px dashed var(--line);border-radius:14px;padding:16px;margin-top:16px}
.aibox .lbl{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}summary{cursor:pointer;font-weight:600;min-height:28px}
ul.clean{padding-left:20px;margin:6px 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;gap:6px}
 .brand{padding:0 6px 0 2px;font-size:0;flex:none}.brand i{width:24px;height:24px}
 .nav{flex-direction:row;gap:4px}.nav a{flex:none;min-height:38px;white-space:nowrap;font-size:14px}.nav .sep{display:none}
 .stat{display:none}.hero,.two{grid-template-columns:minmax(0,1fr)}.three{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.match{grid-template-columns:minmax(0,1fr)}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}
 .msg.u{margin-left:0}.notes div{grid-template-columns:minmax(0,1fr)}
}

<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<div class="app">
 <aside class="side">
  <div class="brand"><i></i>Academia v2</div>
  <nav class="nav" id="nav"></nav>
  <div class="stat" id="stat">Carregando…</div>
 </aside>
 <main id="view"><p class="muted">Carregando a base de conhecimento…</p></main>
</div>
<div id="layer"></div>
<script>
/* Engine: regras puras da plataforma (sem DOM, sem rede, sem IA).
   Usado pela página e pelos testes automatizados (node). */
const Engine = (() => {
  const TYPES = ['mc', 'tf', 'open', 'match', 'fill', 'bug', 'trace', 'code', 'practice'];
  const TYPE_NAMES = { mc: 'Múltipla escolha', tf: 'Verdadeiro ou falso', open: 'Resposta aberta', match: 'Associação', fill: 'Preenchimento de código', bug: 'Identificação de erro', trace: 'Rastreamento de execução', code: 'Desafio de programação', practice: 'Exercício prático' };
  const LEVELS = ['I', 'M', 'A', 'E'];
  const STATUSES = ['draft', 'review', 'approved', 'published'];
  const norm = (s) => String(s ?? '').trim().replace(/\s+/g, ' ');
  const fold = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const isUrl = (u) => { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; } catch (e) { return false; } };

  /* ---------- Correção determinística ---------- */
  function grade(ex, resp) {
    const r = { score: 0, correct: false, detail: null, selfAssessed: false };
    if (resp == null) return r;
    switch (ex.type) {
      case 'mc': r.correct = resp === ex.answer; r.score = r.correct ? 1 : 0; break;
      case 'tf': r.correct = resp === ex.answer; r.score = r.correct ? 1 : 0; break;
      case 'bug': r.correct = Number(resp) === Number(ex.answer); r.score = r.correct ? 1 : 0; break;
      case 'match': {
        const ok = ex.pairs.map((p, i) => resp[i] === p[1]);
        r.detail = ok; r.score = ok.filter(Boolean).length / ex.pairs.length; r.correct = r.score === 1; break;
      }
      case 'fill': {
        const ok = ex.answers.map((vars, i) => vars.some((v) => norm(v) === norm(resp[i])));
        r.detail = ok; r.score = ok.filter(Boolean).length / ex.answers.length; r.correct = r.score === 1; break;
      }
      case 'trace': {
        const ok = ex.steps.map((st, i) => st.answers.some((v) => norm(v).toLowerCase() === norm(resp[i]).toLowerCase()));
        r.detail = ok; r.score = ok.filter(Boolean).length / ex.steps.length; r.correct = r.score === 1; break;
      }
      case 'open': case 'practice': {
        const list = ex.type === 'open' ? ex.rubric : ex.steps;
        const checks = (resp.checks || []).slice(0, list.length);
        r.score = list.length ? checks.filter(Boolean).length / list.length : 0; r.correct = r.score >= 0.7; r.selfAssessed = true; break;
      }
      case 'code': r.score = resp.total ? resp.passed / resp.total : 0; r.correct = resp.total > 0 && resp.passed === resp.total; r.detail = resp.results || null; break;
    }
    return r;
  }
  function gradeAll(items, answers) {
    let pts = 0, max = 0; const per = items.map((ex) => { const g = grade(ex, answers[ex.id]); const p = ex.points || 10; max += p; pts += p * g.score; return { id: ex.id, ...g }; });
    return { per, points: Math.round(pts * 10) / 10, max, pct: max ? Math.round((100 * pts) / max) : 0 };
  }

  /* ---------- Validação de conteúdo (CMS e importação) ---------- */
  function validateExercise(ex) {
    const e = [];
    if (!ex || typeof ex !== 'object') return ['exercício inválido'];
    if (!ex.id || !/^[A-Za-z0-9_.:@+~-]+$/.test(ex.id)) e.push('id ausente ou com caracteres inválidos');
    if (!TYPES.includes(ex.type)) e.push('type deve ser um de: ' + TYPES.join(', '));
    if (!ex.prompt) e.push('prompt (enunciado) é obrigatório');
    if (!ex.explanation) e.push('explanation (explicação da resposta) é obrigatória');
    if (ex.points != null && !(ex.points > 0)) e.push('points deve ser positivo');
    if (ex.difficulty != null && ![1, 2, 3].includes(ex.difficulty)) e.push('difficulty deve ser 1, 2 ou 3');
    switch (ex.type) {

    if (resp == null) return null;
    if (ex.type === 'mc') return resp; if (ex.type === 'tf') return resp ? 1 : 0; if (ex.type === 'bug') return Number(resp);
    if (['match', 'fill', 'trace'].includes(ex.type)) return (g && g.detail || []).map((ok, i) => (ok ? '' : i)).filter((x) => x !== '');
    if (ex.type === 'code') return ((g && g.detail) || []).filter((t) => !t.ok).map((t) => t.name);
    return null;
  }
  function itemAnalysis(items, statDocs, opts) {
    const o = { ...IA, ...(opts || {}) };
    return (items || []).map((ex) => {
      const rows = (statDocs || []).map((d) => d && d.items && d.items[ex.id]).filter((x) => x && typeof x.f === 'number');
      const n = rows.length; const p = n ? rows.reduce((s, x) => s + x.f / 100, 0) / n : null; const avgTries = n ? rows.reduce((s, x) => s + (x.t || 1), 0) / n : null;
      const flags = []; const dist = {};
      if (n >= o.minN) {
        if (p < o.low) flags.push({ k: 'baixa', t: 'Taxa de acerto muito baixa (' + Math.round(p * 100) + '%)' });
        if (p > o.high) flags.push({ k: 'alta', t: 'Taxa de acerto muito alta (' + Math.round(p * 100) + '%): a questão pode não discriminar' });
        if (avgTries >= o.tries) flags.push({ k: 'tentativas', t: 'Média de ' + avgTries.toFixed(1) + ' tentativas por aluno' });
        if (['mc', 'tf', 'bug'].includes(ex.type)) {
          rows.forEach((x) => { if (x.c != null) dist[x.c] = (dist[x.c] || 0) + 1; });
          const correct = ex.type === 'tf' ? (ex.answer ? 1 : 0) : ex.answer;
          const wrong = Object.entries(dist).filter(([k]) => String(k) !== String(correct)).sort((a, b) => b[1] - a[1])[0];
          if (wrong && wrong[1] / n >= o.distractor) flags.push({ k: 'ambigua', t: 'Possível ambiguidade: ' + Math.round((100 * wrong[1]) / n) + '% escolheram ' + (ex.type === 'mc' ? 'a opção ' + String.fromCharCode(65 + Number(wrong[0])) : ex.type === 'bug' ? 'a linha ' + wrong[0] : wrong[0] === '1' ? 'Verdadeiro' : 'Falso') });
        }
        if (['match', 'fill', 'trace', 'code'].includes(ex.type)) {
          rows.forEach((x) => (Array.isArray(x.c) ? x.c : []).forEach((k) => { dist[k] = (dist[k] || 0) + 1; }));
          Object.entries(dist).filter(([, v]) => v / n >= o.part).forEach(([k, v]) => flags.push({ k: 'recorrente', t: 'Erro recorrente (' + Math.round((100 * v) / n) + '%) em ' + (ex.type === 'code' ? 'teste "' + k + '"' : 'parte ' + (Number(k) + 1)) }));
        }
      }
      return { id: ex.id, type: ex.type, prompt: ex.prompt, n, p: p == null ? null : Math.round(p * 100), avgTries: avgTries == null ? null : Math.round(avgTries * 10) / 10, dist, flags, enough: n >= o.minN };
    });
  }

  /* ---------- Pré-requisitos entre cursos ---------- */
  function prereqStatus(course, courses, progress) {
    return (course.requires || []).map((id) => { const c = courses[id]; const cp = progress && progress[id]; return { id, title: c ? c.title : id, exists: !!c, passed: !!(cp && cp.passed), started: !!cp }; });
  }

  /* ---------- Atualização incremental do pacote ---------- */
  /* Decide o que gravar: cria o que falta; atualiza só o que veio do pacote e não foi editado (seedRev menor e updatedAt igual ao do pacote anterior). */
  function seedPlan(docs, existing, drafts) {
    return docs.map((d) => {
      const cur = existing[d.path]; const hasDraft = drafts && drafts[d.path];
      if (!cur) return { ...d, action: 'create' };
      if (d.path === 'kb_meta/catalog') return { ...d, action: (cur.seedRev || 0) < (d.data.seedRev || 0) ? 'merge' : 'skip' };
      const fromSeed = cur.seedRev != null && cur.seedStamp && cur.updatedAt === cur.seedStamp;
      if (fromSeed && !hasDraft && cur.seedRev < (d.data.seedRev || 0)) return { ...d, action: 'update' };
      return { ...d, action: 'skip' };
    });
  }
  function mergeCatalog(cur, seed) {
    const out = JSON.parse(JSON.stringify(cur));
    (seed.areas || []).forEach((sa) => {
      let a = out.areas.find((x) => x.id === sa.id); if (!a) { out.areas.push(JSON.parse(JSON.stringify(sa))); return; }
      sa.disciplines.forEach((sd) => { const d = a.disciplines.find((x) => x.id === sd.id); if (!d) a.disciplines.push(JSON.parse(JSON.stringify(sd))); else d.courses = [...new Set([...(d.courses || []), ...(sd.courses || [])])]; });
    });
    (seed.tracks || []).forEach((t) => { if (!out.tracks.some((x) => x.id === t.id)) out.tracks.push(t); });
    out.seedRev = seed.seedRev; return out;
  }

  return { lessonChecklist, courseChecklist, itemsChecklist, checklistOk, coverage, respSummary, itemAnalysis, IA, prereqStatus, seedPlan, mergeCatalog, validateDocs, docsToBundle, DOC_COLS, TYPES, TYPE_NAMES, LEVELS, STATUSES, REL, REL_NAMES, UPDATE_TYPES, norm, fold, isUrl, grade, gradeAll, validateExercise, validateLesson, validateCourse, validateBundle, buildTestSource, buildRunSource, sm2, addDays, courseLessonIds, courseProgress, relFromCvss, radarKey, dedupe, relAtLeast, notifications, tokens, search, reliabilityFor };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Engine;

 KIND:{course:'courses',lesson:'lessons',exset:'exsets',assess:'assess',project:'projects',page:'pages'},

 },

 /* Estado editorial do item em edição: rascunho pendente ou o próprio item. */

const AI={

 RULES:`Você é o professor particular de uma plataforma de ensino de engenharia de software. A plataforma tem uma base de conhecimento própria: cursos, aulas, exercícios e referências cadastrados e revisados. Seu papel é COMPLEMENTAR.

- Use primeiro o conteúdo da plataforma fornecido abaixo. Quando usar uma informação da aula, diga "Segundo a aula <título>". Quando der uma opinião ou recomendação sua, diga "Recomendação do professor". Quando algo não estiver na base, avise que vem do seu conhecimento geral e pode precisar de verificação.
- Não invente fontes, links, versões nem resultados. Só cite links que aparecem no conteúdo fornecido.
- Não entregue a solução completa de exercícios: dê dicas progressivas. Só mostre a solução se o aluno pedir explicitamente.

  return 'Aluno: '+(S.profile.name||'não informado')+'. Objetivo: '+S.profile.goal+'. Cursos: '+cs+'. Exercícios com dificuldade: '+weak+'.'},
 lessonExcerpt(l,max){const t=[l.title,'Objetivos: '+(l.objectives||[]).join('; '),'Conceitos: '+(l.concepts||[]).map(c=>c.term+': '+c.def).join('; '),'Resumo: '+l.summary,'Teoria: '+String(l.theory||'').slice(0,max||1600)].join('\n');return 'AULA ID '+l.id+' — '+t},
 kbContext(q,pin){const docs=Research.index();const hits=E.search(docs,q,{cat:'aula'}).slice(0,3).map(h=>KB.lessons[h.id]).filter(Boolean);if(pin&&KB.lessons[pin]&&!hits.includes(KB.lessons[pin]))hits.unshift(KB.lessons[pin]);
  const lessonsTxt=hits.map(l=>AI.lessonExcerpt(l,pin===l.id?3500:1400)).join('\n\n');
  const refs=Research.index().filter(d=>d.cat==='ref');const rh=E.search(refs,q).slice(0,5).map(r=>'- '+r.title+' ('+r.url+')'+(r.text?': '+r.text.slice(0,200):'')).join('\n');

const CB=[];
function inl(s){return s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((#[A-Za-z0-9_.-]+)\)/g,'<a href="$2">$1</a>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')}
function md(src){
 const parts=String(src||'').split(/```/);let html='';
 parts.forEach((p,k)=>{
  if(k%2===1){const nl=p.indexOf('\n');let lang=nl>=0?p.slice(0,nl).trim():'';let code=nl>=0?p.slice(nl+1):p;if(/\s/.test(lang)){code=p;lang=''}html+=codeBlock(code.replace(/\n$/,''),lang);return}
  const L=p.split('\n');let i=0;
  while(i<L.length){const l=L[i];if(!l.trim()){i++;continue}let m;
   if(m=l.match(/^(#{1,4})\s+(.*)/)){const n=Math.min(4,m[1].length+1);html+=`<h${n}>${inl(esc(m[2]))}</h${n}>`;i++;continue}
   if(/^\s*\|.*\|\s*$/.test(l)){const rows=[];while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){rows.push(L[i]);i++}const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const body=rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));html+='<div class="tw"><table><thead><tr>'+cells(body[0]).map(c=>'<th>'+inl(esc(c))+'</th>').join('')+'</tr></thead><tbody>'+body.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inl(esc(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
   if(/^\s*([-*]|\d+[.)])\s+/.test(l)){const ord=/^\s*\d/.test(l);let it='';while(i<L.length&&/^\s*([-*]|\d+[.)])\s+/.test(L[i])){it+='<li>'+inl(esc(L[i].replace(/^\s*([-*]|\d+[.)])\s+/,'')))+'</li>';i++}html+=ord?'<ol>'+it+'</ol>':'<ul>'+it+'</ul>';continue}
   if(/^>\s?/.test(l)){let q='';while(i<L.length&&/^>\s?/.test(L[i])){q+=inl(esc(L[i].replace(/^>\s?/,'')))+' ';i++}html+='<blockquote>'+q+'</blockquote>';continue}
   const para=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\s*([-*]|\d+[.)])\s|>|\s*\|)/.test(L[i])){para.push(inl(esc(L[i])));i++}
   if(para.length)html+='<p>'+para.join('<br>')+'</p>';else i++;
  }
 });return html;
}
const KW=/\b(const|let|var|function|return|if|else|for|while|of|in|new|async|await|try|catch|finally|throw|class|extends|import|from|export|default|true|false|null|undefined|typeof|instanceof|this|switch|case|break|continue)\b/g;
function hl(code){
 // destaque simples e seguro: escapa primeiro, depois marca comentários, strings, palavras-chave e números
 const out=[];let rest=String(code);const re=/(\/\/[^\n]*)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\.|[^`\\])*`)/g;let last=0,m;
 while((m=re.exec(rest))){out.push(['x',rest.slice(last,m.index)]);out.push([m[1]?'c':'s',m[0]]);last=re.lastIndex}out.push(['x',rest.slice(last)]);
 const e2=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return out.map(([t,s])=>t==='x'?e2(s).replace(KW,'<span class="tok-k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tok-n">$1</span>'):'<span class="tok-'+t+'">'+esc(s)+'</span>').join('');
}
function codeBlock(code,lang,numbered){CB.push(code);const idx=CB.length-1;const body=numbered?'<div class="ln">'+String(code).split('\n').map((l,n)=>'<span>'+(n+1)+'</span><code>'+(hl(l)||' ')+'</code>').join('')+'</div>':'<pre><code>'+hl(code)+'</code></pre>';return `<div class="code"><div class="codebar"><span>${esc(lang||'código')}</span><button class="cp" data-act="cp" data-i="${idx}">Copiar</button></div>${body}</div>`}

const RESP={};const SHOWN={};
function shuffleFor(id,arr){let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;const a=arr.slice();for(let i=a.length-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
/* Critério de correção exibido junto da explicação (todos determinísticos, exceto os autoavaliados). */
const CRIT={mc:x=>'alternativa correta: '+String.fromCharCode(65+x.answer)+'.',tf:x=>'resposta correta: '+(x.answer?'Verdadeiro':'Falso')+'.',bug:x=>'linha '+x.answer+'.',match:x=>'cada par vale '+Math.round(100/x.pairs.length)+'% da nota.',fill:x=>'cada lacuna vale '+Math.round(100/x.answers.length)+'%; espaços extras são ignorados.',trace:x=>'cada resposta vale '+Math.round(100/x.steps.length)+'%; maiúsculas e espaços extras são ignorados.',code:x=>'nota proporcional aos '+x.tests.length+' testes automatizados que passam.',open:x=>'autoavaliação pelos '+x.rubric.length+' critérios; 70% ou mais conta como atendido.',practice:x=>'autoavaliação pelos '+x.steps.length+' passos concluídos.'};
function exHTML(ex,ctx){
 const r=RESP[ex.id];const g=SHOWN[ex.id];const rec=S.ex[ex.id];const exam=ctx==='exam';const fb=g&&!exam?g:(exam&&UI.exam&&UI.exam.res?UI.exam.res.per.find(p=>p.id===ex.id):null);
 let body='';const dis=fb?'disabled':'';
 switch(ex.type){
  case 'mc':body=(ex.code?codeBlock(ex.code,'javascript'):'')+ex.options.map((o,i)=>{let c='';if(fb){if(i===ex.answer)c='right';else if(r===i)c='wrong'}return `<label class="opt ${c}"><input type="radio" name="r-${ex.id}" data-ex="${ex.id}" data-v="${i}" ${r===i?'checked':''} ${dis}><span>${inl(esc(o))}</span></label>`}).join('');break;
  case 'tf':body=[true,false].map(v=>{let c='';if(fb){if(v===ex.answer)c='right';else if(r===v)c='wrong'}return `<label class="opt ${c}"><input type="radio" name="r-${ex.id}" data-ex="${ex.id}" data-v="${v}" ${r===v?'checked':''} ${dis}><span>${v?'Verdadeiro':'Falso'}</span></label>`}).join('');break;
  case 'bug':body='<div class="code"><div class="codebar"><span>clique na linha com o problema</span></div><div style="padding:8px 0">'+String(ex.code).split('\n').map((ln,i)=>{const n=i+1;let c=r===n?'sel':'';if(fb&&n===ex.answer)c='right';return `<button class="bugline ${c}" data-act="bug-pick" data-ex="${ex.id}" data-n="${n}" ${dis}><span>${n}</span><code>${hl(ln)||' '}</code></button>`}).join('')+'</div></div>';break;
  case 'match':{const rights=shuffleFor(ex.id,ex.pairs.map(p=>p[1]));const rr=r||[];body='<div class="match">'+ex.pairs.map((p,i)=>`<div>${inl(esc(p[0]))}</div><select data-ex="${ex.id}" data-i="${i}" ${dis} aria-label="${esc(p[0])}" style="${fb?'border-color:var(--'+(rr[i]===p[1]?'ok':'bad')+')':''}"><option value="">Escolha…</option>${rights.map(x=>`<option ${rr[i]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`).join('')+'</div>';break}
  case 'fill':{const rr=r||[];const parts=String(ex.code).split(/(\[\[\d+\]\])/);body='<div class="fillcode">'+parts.map(pt=>{const m=pt.match(/^\[\[(\d+)\]\]$/);if(!m)return esc(pt);const i=+m[1];const ok=fb?ex.answers[i].some(v=>E.norm(v)===E.norm(rr[i])):null;return `<input data-ex="${ex.id}" data-i="${i}" value="${esc(rr[i]||'')}" ${dis} aria-label="lacuna ${i+1}" class="${ok==null?'':ok?'right':'wrong'}" autocomplete="off" spellcheck="false">`}).join('')+'</div>';break}
  case 'trace':{const rr=r||[];body=codeBlock(ex.code,ex.lang||'javascript')+'<div class="list" style="margin-top:8px">'+ex.steps.map((st,i)=>{const ok=fb?st.answers.some(v=>E.norm(v).toLowerCase()===E.norm(rr[i]).toLowerCase()):null;return `<div class="item"><span class="t">${inl(esc(st.q))}</span><input data-ex="${ex.id}" data-i="${i}" value="${esc(rr[i]||'')}" ${dis} aria-label="${esc(st.q)}" class="${ok==null?'':ok?'right':'wrong'}" autocomplete="off" spellcheck="false" style="max-width:220px">${fb&&!ok?`<span class="small muted">esperado: <code>${esc(st.answers[0])}</code></span>`:''}</div>`}).join('')+'</div>';break}
  case 'open':{const rr=r||{text:'',checks:[]};body=`<textarea rows="5" data-ex="${ex.id}" data-k="text" placeholder="Escreva sua resposta antes de ver o modelo" ${fb?'disabled':''}>${esc(rr.text||'')}</textarea>${rr.revealed||fb?`<div class="fb"><b>Resposta modelo</b>${md(ex.model)}<b>Marque os critérios que sua resposta atendeu</b>${ex.rubric.map((c,i)=>`<label class="opt"><input type="checkbox" data-ex="${ex.id}" data-ci="${i}" ${rr.checks&&rr.checks[i]?'checked':''} ${dis}><span>${esc(c)}</span></label>`).join('')}</div>`:''}`;break}
  case 'practice':{const rr=r||{checks:[]};body=ex.steps.map((c,i)=>`<label class="opt"><input type="checkbox" data-ex="${ex.id}" data-ci="${i}" ${rr.checks&&rr.checks[i]?'checked':''} ${dis}><span>${esc(c)}</span></label>`).join('');break}
  case 'code':{const st=r||{};const tr=st.results;body=`<div class="ed" id="ed-${ex.id}" data-code-for="${ex.id}"></div>${tr?`<ul class="tres">${tr.map(t=>`<li class="${t.ok?'ok':'bad'}">${t.ok?'✓':'✗'} ${esc(t.name)}${t.ok?'':' — '+esc(t.error)}</li>`).join('')}</ul>`:''}${st.logs&&st.logs.length?`<div class="out">${esc(st.logs.join('\n'))}</div>`:''}${(ex.hints||[]).slice(0,st.hints||0).map((h,i)=>`<div class="fb"><b>Dica ${i+1}:</b> ${inl(esc(h))}</div>`).join('')}${st.sol?`<details open><summary>Solução de referência</summary>${codeBlock(ex.solution,'javascript')}</details>`:''}`;break}
 }
 const actions=exam?'':ex.type==='code'?`<div class="row" style="margin-top:10px"><button class="btn" data-act="code-test" data-ex="${ex.id}">Rodar testes</button><button class="btn g s" data-act="code-hint" data-ex="${ex.id}" ${((r&&r.hints)||0)>=(ex.hints||[]).length?'disabled':''}>Dica (${(r&&r.hints)||0}/${(ex.hints||[]).length})</button><button class="btn g s" data-act="code-sol" data-ex="${ex.id}">Ver solução</button><a class="btn g s" href="#lab-${ex.id}">Abrir no laboratório</a></div>`
  :ex.type==='open'&&!(r&&r.revealed)&&!fb?`<div class="row" style="margin-top:10px"><button class="btn" data-act="open-reveal" data-ex="${ex.id}">Ver resposta modelo</button></div>`
  :!fb?`<div class="row" style="margin-top:10px"><button class="btn" data-act="ex-check" data-ex="${ex.id}">${ex.type==='open'||ex.type==='practice'?'Registrar autoavaliação':'Verificar resposta'}</button></div>`
  :`<div class="row" style="margin-top:10px"><button class="btn g s" data-act="ex-retry" data-ex="${ex.id}">Tentar de novo</button>${AI.on()&&!fb.correct?`<button class="btn g s" data-act="ai-ex" data-ex="${ex.id}">Pedir explicação ao professor IA</button>`:''}</div>`;
 const crit=CRIT[ex.type]?`<div class="small muted" style="margin-top:6px">Critério de correção: ${CRIT[ex.type](ex)}</div>`:'';const fbHtml=fb&&ex.type!=='code'?`<div class="fb"><b class="${fb.correct?'ok':'warn'}">${fb.selfAssessed?'Autoavaliação: '+Math.round(fb.score*100)+'%':fb.correct?'Correto.':fb.score>0?'Parcialmente correto ('+Math.round(fb.score*100)+'%).':'Incorreto.'}</b> ${md(ex.explanation)}${crit}</div><div id="ai-ex-${ex.id}" class="md"></div>`:ex.type==='code'&&r&&r.results?`<div class="fb small">${md(ex.explanation)}${crit}</div><div id="ai-ex-${ex.id}" class="md"></div>`:'';
 return `<div class="ex ${fb?(fb.correct?'good':'badx'):''}"><div class="head"><span class="pill">${E.TYPE_NAMES[ex.type]}</span><span class="pill">${'●'.repeat(ex.difficulty||1)}${'○'.repeat(3-(ex.difficulty||1))}</span><span class="pill">${ex.points||10} pts</span>${!exam&&rec?`<span class="pill ${rec.correct?'ok':'warn'}">${rec.tries} tentativa(s) · melhor ${rec.best}%</span>`:''}</div><div class="md">${md(ex.prompt)}</div>${body}${actions}${fbHtml}</div>`;
}

let CM=null;const EDS={};
async function loadCM(){if(CM!==null)return CM;try{const [cm,js]=await Promise.all([import('https://cdn.jsdelivr.net/npm/codemirror@6.0.1/+esm'),import('https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@6.2.2/+esm')]);CM={EditorView:cm.EditorView,basicSetup:cm.basicSetup,javascript:js.javascript}}catch(e){CM=false}return CM}
function mountEditors(root){(root||document).querySelectorAll('[data-code-for]').forEach(el=>{const id=el.dataset.codeFor;if(el.dataset.mounted)return;el.dataset.mounted='1';const f=findEx(id);const lab=id==='__free__'?null:(f?f.ex:PROJ_LAB(id));const init=(RESP[id]&&RESP[id].code)!=null?RESP[id].code:id==='__free__'?(S.lab.__free__code||"// Escreva JavaScript e clique em Executar\nconst soma = (a, b) => a + b;\nconsole.log(soma(2, 3));\n"):(lab&&lab.starter)||'';mountEditor(el,id,init)})}
function mountEditor(el,id,code){
 const fallback=()=>{el.innerHTML=`<textarea class="code" spellcheck="false" data-ta="${id}" aria-label="Editor de código">${esc(code)}</textarea>`;EDS[id]={get:()=>el.querySelector('textarea').value,set:v=>{el.querySelector('textarea').value=v}}};
 fallback();
 loadCM().then(cm=>{if(!cm||!document.body.contains(el))return;const cur=EDS[id].get();el.innerHTML='';const view=new cm.EditorView({doc:cur,extensions:[cm.basicSetup,cm.javascript(),cm.EditorView.updateListener.of(u=>{if(u.docChanged)codeChanged(id,view.state.doc.toString())})],parent:el});EDS[id]={get:()=>view.state.doc.toString(),set:v=>view.dispatch({changes:{from:0,to:view.state.doc.length,insert:v}})}}).catch(()=>{});
}
let codeT;function codeChanged(id,v){RESP[id]=RESP[id]||{};RESP[id].code=v;clearTimeout(codeT);codeT=setTimeout(()=>{if(id==='__free__'){S.lab.__free__code=v;save()}},1500)}
const PROJ_LAB=id=>{const p=KB.projects[id];return p&&p.lab?{id,...p.lab,type:'code',hints:[],explanation:'Projeto: todos os testes devem passar para cumprir os critérios de aceitação automatizados.'}:null};
function runWorker(src,ms){return new Promise(res=>{let w;try{w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){res({error:'Não foi possível criar o ambiente isolado: '+e.message});return}
 const t=setTimeout(()=>{w.terminate();res({error:'Tempo esgotado ('+(ms/1000)+' s). Verifique laços infinitos ou promises que nunca terminam.'})},ms);
 w.onmessage=e=>{clearTimeout(t);w.terminate();res(e.data)};w.onerror=e=>{clearTimeout(t);w.terminate();e.preventDefault();res({error:'Erro de sintaxe ou execução: '+(e.message||'desconhecido')})}})}
async function runTests(id,ex){const code=EDS[id]?EDS[id].get():'';RESP[id]=RESP[id]||{};RESP[id].code=code;const out=await runWorker(E.buildTestSource(code,ex.tests),6000);
 const results=out.res||[{name:'Execução',ok:false,error:out.error}];const passed=results.filter(x=>x.ok).length;RESP[id].results=results;RESP[id].logs=out.logs||[];
 const g=E.grade({type:'code'},{passed,total:ex.tests.length,results});(S.lab[id]=S.lab[id]||[]).push({at:nowIso(),passed,total:ex.tests.length,sol:!!RESP[id].sol});
 if(!PROJ_LAB(id))LMS.recordEx(ex,g,'code');else save();return {passed,total:ex.tests.length,results,logs:out.logs||[]}}
V.lab=r=>{const sel=r.id||'__free__';const f=sel==='__free__'?null:(findEx(sel)||(PROJ_LAB(sel)?{ex:PROJ_LAB(sel)}:null));const ex=f&&f.ex;

 <div style="margin-top:14px" class="ed" data-code-for="${sel}"></div>
 <div class="row" style="margin-top:10px">${ex?`<button class="btn" data-act="lab-test" data-ex="${sel}">Rodar ${ex.tests.length} testes</button>`:'<button class="btn" data-act="lab-run">Executar</button>'}<button class="btn g" data-act="lab-format" data-ex="${sel}">Formatar código</button>${ex&&ex.starter?`<button class="btn g s" data-act="lab-reset" data-ex="${sel}">Restaurar código inicial</button>`:''}</div>
 <div id="lab-out">${st.results?`<ul class="tres">${st.results.map(t=>`<li class="${t.ok?'ok':'bad'}">${t.ok?'✓':'✗'} ${esc(t.name)}${t.ok?' ('+t.ms+' ms)':' — '+esc(t.error)}</li>`).join('')}</ul>`:''}${st.logs&&st.logs.length?`<div class="out">${esc(st.logs.join('\n'))}</div>`:''}</div>
 ${hist.length?`<h2>Histórico de tentativas</h2><table><thead><tr><th>Data</th><th class="n">Testes</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${h.at.slice(0,16).replace('T',' ')}</td><td class="n ${h.passed===h.total?'ok':'bad'}">${h.passed}/${h.total}${h.sol?' (viu solução)':''}</td></tr>`).join('')}</tbody></table>`:''}
 ${aiBox('ai-lab','<button class="btn g s" data-act="ai-lab" data-mode="analise">Analisar meu código</button><button class="btn g s" data-act="ai-lab" data-mode="erro">Ajudar a interpretar o erro</button>')}

const TECH2DISC={react:'react',nextjs:'next',typescript:'ts','react-native':'rn',flutter:'flutter',dart:'dart',kotlin:'kotlin-android',java:'java',nodejs:'node',nestjs:'nest',postgresql:'pg',redis:'nosql',docker:'docker',kubernetes:'docker',rabbitmq:'brokers',kafka:'brokers',aws:'cloud',azure:'cloud',gcp:'cloud',jest:'test-js',vitest:'test-js',playwright:'test-js',cypress:'test-js',javascript:'js'};
const Radar={
 entries(){return Object.values(KB.radar).filter(x=>x.status!=='archived').sort((a,b)=>String(b.date).localeCompare(String(a.date)))},
 notifs(){return E.notifications(Radar.entries(),S.radar)},
 techName(id){const t=(KB.radarCfg().techs||[]).find(x=>x.id===id);return t?t.name:id},
 recs(){const out=[];const doneLessons={};Object.values(S.courses).forEach(cp=>Object.entries(cp.lessons||{}).forEach(([id,v])=>{if(v.done)doneLessons[id]=v.at}));
  Radar.entries().filter(e=>S.radar.watch.includes(e.tech)&&E.relAtLeast(e.relevance,S.radar.minRel)).forEach(e=>{
   (e.lessonIds||[]).forEach(id=>{if(doneLessons[id]&&doneLessons[id].slice(0,10)<=String(e.date||e.createdAt).slice(0,10)+'z'){const l=KB.lesson(id);if(l)out.push({c:'w',t:'Revise: '+l.title,s:'Atualização: '+e.title,h:'#l-'+id,kind:'desatualizado'})}else if(KB.lesson(id)&&!doneLessons[id])out.push({c:'',t:'Estude: '+KB.lessons[id].title,s:'Relacionada a: '+e.title,h:'#l-'+id,kind:'aula'})});
  });
  S.radar.watch.forEach(t=>{const tagged=Object.keys(doneLessons).some(id=>(KB.lessons[id]&&KB.lessons[id].tags||[]).includes(t));if(!tagged){const d=KB.disc(TECH2DISC[t]);if(d)out.push({c:'',t:'Lacuna: '+Radar.techName(t),s:'Você acompanha esta tecnologia, mas ainda não estudou conteúdos dela. Disciplina: '+d.name,h:'#d-'+d.id,kind:'lacuna'})}});
  const seen=new Set();return out.filter(x=>!seen.has(x.h+x.t)&&seen.add(x.h+x.t))},
 nextList(){const r=[];const due=LMS.dueCards().length;if(due)r.push({c:'m',t:'Revisão espaçada: '+due+' cartão(ões)',s:'Reforce o que você já estudou',h:'#revisao'});
  Radar.notifs().filter(e=>E.relAtLeast(e.relevance,'alta')).slice(0,2).forEach(e=>r.push({c:'r',t:'Alerta: '+e.title,s:E.REL_NAMES[e.relevance]+' · '+Radar.techName(e.tech),h:'#radar'}));
  KB.courseList().filter(c=>S.courses[c.id]).forEach(c=>{const n=LMS.nextLesson(c);if(n)r.push({c:'',t:KB.lessons[n].title,s:'Próxima aula · '+c.title,h:'#l-'+n});else if(!S.courses[c.id].passed&&KB.assess[c.id])r.push({c:'',t:'Avaliação final: '+c.title,s:'Todas as aulas concluídas',h:'#prova-'+c.id})});
  LMS.weakEx().slice(0,2).forEach(id=>{const f=findEx(id);if(f&&f.lid)r.push({c:'w',t:'Refaça um exercício',s:(KB.lessons[f.lid]||{}).title||'',h:'#l-'+f.lid})});
  Radar.recs().filter(x=>x.kind==='desatualizado').slice(0,2).forEach(x=>r.push(x));
  S.myTrack.slice(0,2).forEach(t=>r.push({c:'',t:t.title,s:'Da sua trilha pessoal',h:t.href}));
  if(!r.length){const c=KB.courseList()[0];r.push(c?{c:'',t:'Comece: '+c.title,s:'Curso completo disponível',h:'#c-'+c.id}:{c:'',t:'Explore o catálogo',s:'',h:'#catalogo'})}
  return r}
};

 <div class="w"><h3>Recomendações personalizadas</h3>${recs.length?recs.slice(0,6).map(r=>`<a class="rec" href="${r.h}"><span class="dot ${r.c}"></span><span><b>${esc(r.t)}</b><span class="small muted">${esc(r.s)}</span></span></a>`).join(''):'<p class="small muted">Sem recomendações no momento.</p>'}</div></div>
 ${alerts.length?`<h2>Alertas importantes</h2><div class="list">${alerts.map(radarItem).join('')}</div>`:''}
 <h2>Atualizações</h2><div class="chips">${['all','critica','alta','media','informativa'].map(r=>`<button class="chip ${f===r?'on':''}" data-act="rf" data-r="${r}">${r==='all'?'Todas':E.REL_NAMES[r]}</button>`).join('')}<select id="rt" aria-label="Tecnologia" style="width:auto"><option value="all">Todas as tecnologias</option>${(cfg.techs||[]).map(t=>`<option value="${t.id}" ${UI.rt===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
 ${shown.length?`<div class="list">${shown.map(radarItem).join('')}</div>`:'<div class="empty">Nenhuma atualização registrada com esses filtros.</div>'}

 <div class="three"><div><label for="r-min">Relevância mínima</label><select id="r-min">${E.REL.map(r=>`<option value="${r}" ${S.radar.minRel===r?'selected':''}>${E.REL_NAMES[r]}</option>`).join('')}</select></div><div><label for="r-freq">Frequência desejada de verificação</label><select id="r-freq">${['diaria','semanal','quinzenal','mensal'].map(x=>`<option ${S.radar.freq===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="r-not">Notificações</label><select id="r-not"><option value="1" ${S.radar.notify?'selected':''}>Ativadas</option><option value="0" ${!S.radar.notify?'selected':''}>Desativadas</option></select></div></div>
 <label>Categorias de interesse (vazio = todas)</label><div class="chips">${Object.entries(E.UPDATE_TYPES).map(([k,n])=>`<button class="chip ${S.radar.cats.includes(k)?'on':''}" data-act="rcat" data-k="${k}">${n}</button>`).join('')}</div>
 <p class="note">Última verificação registrada: ${cfg.lastCheck?fmtD(cfg.lastCheck)+' ('+esc(cfg.lastCheckBy||'')+')':'nenhuma'}. A coleta automática roda fora desta página (veja <a href="#pg-arquitetura">Arquitetura</a>).</p></div>
 <h2>Histórico de notificações</h2>${Object.keys(S.radar.seen).length?`<div class="list">${Object.entries(S.radar.seen).sort((a,b)=>b[1].localeCompare(a[1])).map(([id,at])=>{const e=KB.radar[id];return e?`<div class="item"><span class="t">${esc(e.title)}</span><span class="small muted">vista em ${fmtD(at)}</span></div>`:''}).join('')}</div>`:'<p class="small muted">Nenhuma notificação vista ainda.</p>'}
 ${ADMIN?radarAdminHTML():''}`};

 const byCourse=cs.map(c=>{const ids=E.courseLessonIds(c).flatMap(id=>KB.exset(id).map(x=>x.id));const done=ids.filter(id=>S.ex[id]);return {c,n:ids.length,d:done.length,avg:done.length?Math.round(done.reduce((s,id)=>s+S.ex[id].best,0)/done.length):null,p:E.courseProgress(c,S.courses[c.id])}}).filter(x=>x.p.started||x.d);

const edBar=id=>`<div class="tb" role="toolbar" aria-label="Formatação">${[['b','Negrito','B'],['i','Itálico','I'],['code','Código','</>'],['h','Título','H'],['ul','Lista','•'],['link','Link','🔗'],['block','Bloco de código','{ }']].map(([a,t,s])=>`<button type="button" data-act="mdtool" data-t="${id}" data-k="${a}" title="${t}" aria-label="${t}">${esc(s)}</button>`).join('')}<button type="button" data-act="mdprev" data-t="${id}" title="Pré-visualizar">Pré-visualizar</button></div>`;

const pubBar=(kind,id,exists)=>{const main=KB[KB.KIND[kind]][id];const d=KB.draftOf(kind,id);const st=exists?KB.stage(kind,id):null;const ck=exists?KB.checklist(kind,id):[];const ckOk=E.checklistOk(ck);const cur=exists?KB.current(kind,id):null;
 const steps=['draft','review','approved','published'];const flow=exists?`<div class="row small" style="margin-top:10px;gap:6px" aria-label="Fluxo editorial">${steps.map((x,i)=>`<span class="pill ${st===x?'ok':''}">${i+1}. ${STN[x]}</span>`).join('<span class="muted">→</span>')}</div>`:'';
 const dates=main?`<div class="small muted" style="margin-top:6px">Última revisão: ${fmtD(main.lastReviewedAt)} · Próxima revisão: ${main.nextReviewAt?`<b class="${main.nextReviewAt<today()?'bad':''}">${fmtD(main.nextReviewAt)}</b>`:'—'}${main.publishedAt?' · Publicado em '+fmtD(main.publishedAt):''}</div>`:'';
 const ckHtml=ck.length?`<details ${ckOk?'':'open'} style="margin-top:10px"><summary><b>Checklist de publicação</b> ${ckOk?'<span class="pill ok">completo</span>':'<span class="pill warn">'+ck.filter(x=>!x.ok).length+' pendência(s)</span>'}</summary><ul class="clean" style="margin-top:6px">${ck.map(x=>`<li><span class="${x.ok?'ok':'bad'}">${x.ok?'✓':'✗'}</span> ${esc(x.label)}${x.detail&&!x.ok?` <span class="small muted">(${esc(x.detail)})</span>`:''}</li>`).join('')}</ul></details>`:'';
 const btn=(act,label,cls,dis,extra)=>`<button class="btn ${cls||'g s'}" data-act="${act}" data-kind="${kind}" data-id="${esc(id)}" ${dis?'disabled':''} ${extra||''}>${label}</button>`;
 return `<div class="card strong" style="margin:14px 0"><div class="row"><span>Publicado: ${main?stPill(main.status)+' v'+(main.version||0):'<span class="pill">novo</span>'} ${d?'<span class="pill warn">rascunho pendente: '+STN[d.status]+'</span>':''}</span><span style="flex:1"></span>${btn('cms-save','Salvar rascunho','')}${exists?

function collect(kind,id){
 if(kind==='course'){const c={...keep(KB.current('course',id)),...readCourse()};const e=E.validateCourse(c);return {id:c.id,data:c,errors:e}}
 if(kind==='lesson'){const l={...keep(KB.current('lesson',id)),...readLesson()};return {id:l.id,data:l,errors:E.validateLesson(l)}}
 if(kind==='exset'||kind==='assess'){let items;try{items=JSON.parse($('#x-json').value)}catch(e){return {errors:['JSON inválido: '+e.message]}}if(!Array.isArray(items))return {errors:['a lista de questões deve ser um array']};const errs=items.flatMap(x=>E.validateExercise(x).map(m=>(x.id||'?')+': '+m));const ids=items.map(x=>x.id);if(new Set(ids).size!==ids.length)errs.push('ids repetidos');
  if(kind==='exset')return {id,data:{lessonId:id,items},errors:errs};return {id,data:{id,courseId:id,title:$('#a-title').value.trim(),passPct:+$('#a-pass').value||70,minutes:+$('#a-min').value||30,items},errors:errs}}
 if(kind==='project'){let p;try{p=JSON.parse($('#p-json').value)}catch(e){return {errors:['JSON inválido: '+e.message]}}const errs=[];if(!p.id||!/^[A-Za-z0-9_.-]+$/.test(p.id))errs.push('id inválido');if(!p.name)errs.push('name obrigatório');if(p.lab&&(!Array.isArray(p.lab.tests)||!p.lab.tests.length))errs.push('lab.tests obrigatório quando há laboratório');return {id:p.id,data:p,errors:errs}}
 if(kind==='page'){const p={id:$('#pg-id').value.trim(),title:$('#pg-title').value.trim(),md:$('#pg-md').value,tags:$('#pg-tags').value.split(',').map(x=>x.trim()).filter(Boolean)};const errs=[];if(!p.id||!/^[A-Za-z0-9_.-]+$/.test(p.id))errs.push('id inválido');if(!p.title)errs.push('título obrigatório');return {id:p.id,data:p,errors:errs}}
}

/* ============================== PACOTE INICIAL ============================== */
/* Na primeira visita do administrador com o banco vazio, grava o pacote inicial publicado junto da página
   (seed-docs.json). Só cria documentos que ainda não existem: nunca sobrescreve conteúdo editado. */
const SEED_REV=3;
async function fetchSeed(){try{const r=await fetch('seed-docs.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){toast('Pacote da plataforma indisponível: '+e.message);return null}}
/* Instala e atualiza o pacote da plataforma de forma incremental e retomável:
   cria o que falta; atualiza só documentos que vieram do pacote e não foram editados; mescla o catálogo sem apagar nada.
   Cada documento é gravado individualmente, então uma interrupção é retomada na próxima visita. */
async function installSeed(existing){
 const raw=await fetchSeed();if(!raw)return null;
 const v=E.validateDocs(raw);if(v.errors.length){toast('Pacote da plataforma inválido: '+v.errors[0]+(v.errors.length>1?' (+'+(v.errors.length-1)+')':''));return null}
 const docs=v.docs.map(d=>({path:d.path,data:d.data}));
 const ex={};Object.entries(COL).forEach(([k,c])=>{Object.entries((existing&&existing[k])||{}).forEach(([id,d])=>{ex[c+'/'+id]=d})});
 const dr={};Object.values((existing&&existing.drafts)||{}).forEach(d=>{const c=COL[KB.KIND[d.kind]];if(c)dr[c+'/'+d.id]=true});
 const all=E.seedPlan(docs,ex,dr);const plan=all.filter(d=>d.action!=='skip');
 /* conflito = existe conteúdo do usuário (não carimbado pelo pacote nesta revisão ou mais nova) que o pacote não tocou */
 const conflicts=all.filter(d=>d.action==='skip'&&ex[d.path]&&!((ex[d.path].seedRev||0)>=(d.data.seedRev||0))).length;
 let n=0,fail=0;
 for(const d of plan){$('#view').innerHTML='<div class="empty"><span class="load"></span> Atualizando a base de conhecimento: '+(n+fail+1)+' de '+plan.length+'…</div>';
  const data=JSON.parse(JSON.stringify(d.action==='merge'?E.mergeCatalog(ex[d.path],d.data):d.data));
  try{
   if(DB)await DB.doc(d.path).set(data);
   else{/* modo local: grava direto nas coleções em memória; cacheKB() persiste no localStorage */const [c,id]=d.path.split('/');const k=Object.keys(COL).find(x=>COL[x]===c);if(!k)throw new Error('coleção '+c);KB[k][id]=data}
   n++;const [c,id]=d.path.split('/');if(DB&&c==='kb_courses')await KB.audit('course',id,'seed',d.action==='create'?'curso instalado':'curso atualizado')}catch(e){fail++}}
 if(!fail){const info={rev:SEED_REV,at:nowIso(),written:n};if(DB)await DB.doc('kb_meta/seedinfo').set(info).catch(()=>{});else KB.meta.seedinfo=info}
 if(!DB){KB.loaded=true;cacheKB();Research._idx=null}
 if(n){log('kb','Pacote da plataforma: '+n+' documento(s) gravado(s)','#cms');save()}
 toast(n?'Base de conhecimento atualizada ('+n+' documentos'+(fail?', '+fail+' falharam; tente de novo':'')+(conflicts?'; '+conflicts+' preservados por terem sido editados':'')+').':(fail?'Nenhum documento gravado; '+fail+' falharam.':'A base já está atualizada; nada a instalar'+(conflicts?' ('+conflicts+' itens seus preservados)':'')+'.'));
 return n
}
ACT['kb-install']=async()=>{const o=DB?await Store.loadKB():{...Object.fromEntries(Object.keys(COL).map(k=>[k,KB[k]]))};const n=await installSeed(o);if(n!=null){if(DB)KB.apply(await Store.loadKB());cacheKB();Research._idx=null;render(true)}};

 else{ADMIN=true;MODE='local'}
 const timer=setTimeout(()=>{if(!KB.loaded){KB.loaded=true;render(true);toast('O banco está demorando; exibindo a cópia local da base.')}},10000);
 if(DB){let o=await Store.loadKB();clearTimeout(timer);
  if(ADMIN&&(!(o&&o.meta&&o.meta.catalog)||((o.meta.seedinfo||{}).rev||0)<SEED_REV)){const n=await installSeed(o);if(n!=null)o=await Store.loadKB()}
  if(o&&o.meta&&o.meta.catalog){KB.apply(o);cacheKB()}else KB.loaded=true}else{clearTimeout(timer);KB.loaded=true}
 Research._idx=null;
 if(UID){const st=await Store.getUser('state');if(st&&st.v===2)S=Object.assign(fresh(),st);else if(localS&&localS.v===2)Store.putUser('state',S)}
 render(true);
})();
